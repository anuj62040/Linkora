<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linkora</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120F26;--s1:#1C1838;--s2:#262048;--tx:#F3EFFA;--mu:#9A94B8;--ac:#E8C98E;--ac2:#C79A52;--ok:#2BD576;--bad:#FF4D5E;--ln:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:15px/1.45 Manrope,system-ui,sans-serif;color:var(--tx);background:radial-gradient(120% 70% at 50% -10%,#2F2468 0,var(--bg) 60%) fixed;overflow:hidden}
input,button{font:inherit;color:inherit}
input{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;outline:0}
input:focus,button:focus-visible{border-color:var(--ac);box-shadow:0 0 0 3px rgba(232,201,142,.2)}
button{cursor:pointer;border:0;border-radius:14px;padding:14px 18px;background:var(--s2);font-weight:700}
.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#2A1E08}
.ghost{background:transparent;border:1px solid var(--ln)}
.brand{font:700 40px Fraunces,serif;letter-spacing:.5px}
.tag{color:var(--mu)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.screen.on{display:flex}
#auth{align-items:center;justify-content:center;padding:24px;overflow:auto}
.card{width:100%;max-width:400px;background:rgba(28,24,56,.75);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:26px;padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.card h2{font:600 22px Fraunces,serif}
.pw{position:relative}.pw input{padding-right:70px}
.eye{position:absolute;right:6px;top:6px;padding:8px 12px;background:transparent;color:var(--ac);font-size:13px}
.cap{display:flex;gap:8px;align-items:center}
.capv{font:700 20px Fraunces,serif;letter-spacing:5px;background:var(--s2);padding:10px 14px;border-radius:12px;text-decoration:line-through;color:var(--ac)}
.cap button{padding:10px 12px;font-size:12px;white-space:nowrap}
.sep{text-align:center;color:var(--mu);font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:16px}
.link{background:none;color:var(--mu);padding:6px;font-weight:500}
#top{display:flex;align-items:center;gap:10px;padding:14px 18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(43,213,118,.18)}
.page{flex:1;overflow:auto;padding:8px 20px 20px;display:none}.page.on{display:block}
#home.on{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#home .brand{font-size:52px}
.row{display:flex;gap:10px;width:100%;max-width:360px}.row>*{flex:1}
.box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.code{font:700 34px Fraunces,serif;letter-spacing:8px;color:var(--ac)}
nav{display:flex;border-top:1px solid var(--ln);background:rgba(18,15,38,.9)}
nav button{flex:1;background:none;border-radius:0;color:var(--mu);padding:14px}
nav button.on{color:var(--ac)}
.item{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--s1);margin-bottom:10px;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--s2),#3a2f78);display:grid;place-items:center;font:700 18px Fraunces,serif;color:var(--ac);flex:none}
.item small,.sub{color:var(--mu);font-size:12.5px;display:block}
.empty{color:var(--mu);text-align:center;margin-top:60px}
#chat,#call,#inc{z-index:5;background:var(--bg)}
#ch{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--ln);background:var(--s1)}
#ch .grow{flex:1;min-width:0}#ch button{padding:10px 12px;background:transparent}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--s2);align-self:flex-start;word-wrap:break-word}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#2A1E08;border-bottom-right-radius:6px}
.m:not(.me){border-bottom-left-radius:6px}
.m img{max-width:100%;border-radius:12px;display:block}.m i{font-size:10.5px;opacity:.6;display:block;text-align:right;font-style:normal}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln);background:var(--s1);align-items:center}
#bar button{padding:12px 14px;flex:none}
#call{background:#000}#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0a0818}
#lv{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 14px);width:100px;height:140px;object-fit:cover;border-radius:16px;border:2px solid var(--ac);background:#111}
#cname{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:0;right:0;text-align:center;font:600 22px Fraunces,serif;text-shadow:0 2px 10px #000}
#ctl{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 30px);left:0;right:0;display:flex;justify-content:center;gap:16px}
#ctl button{width:60px;height:60px;border-radius:50%;padding:0;background:rgba(255,255,255,.18)}
#ctl .end{background:var(--bad)}
#inc{align-items:center;justify-content:center;gap:16px;text-align:center}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ac);padding:10px 18px;border-radius:14px;z-index:9;display:none}
@media(prefers-reduced-motion:no-preference){.card{animation:up .5s ease}@keyframes up{from{opacity:0;transform:translateY(14px)}}}
</style></head><body>
<!--
SETUP (Firebase): console.firebase.google.com -> new project -> Add Web App -> paste config below.
Enable: Authentication (Email/Password + Google), Firestore Database (test mode), Realtime Database (test mode).
Authentication > Settings > Authorized domains: add YOURNAME.github.io
-->
<div id="auth" class="screen on"><div class="card" id="ac"></div></div>

<div id="app" class="screen">
 <div id="top"><i class="dot" id="medot"></i><b id="mename"></b></div>
 <div class="page on" id="home">
  <div><div class="brand">Linkora</div><p class="tag">Connect instantly. Talk freely.</p></div>
  <div class="row"><button class="pri" data-a="mk">Create room</button><button class="ghost" data-a="jn">Join room</button></div>
  <div class="box" id="rbox"></div>
 </div>
 <div class="page" id="chats"></div>
 <div class="page" id="prof"><div class="item"><div class="av" id="pav"></div><div><b id="pn"></b><small id="pu"></small></div></div><button class="ghost" style="width:100%" data-a="out">Log out</button></div>
 <nav><button class="on" data-p="home">Home</button><button data-p="chats">Chats</button><button data-p="prof">Profile</button></nav>
</div>

<div id="chat" class="screen">
 <div id="ch"><button data-a="back">Back</button><i class="dot" id="odot"></i><div class="grow"><b id="oname"></b><span class="sub" id="ostat"></span></div><button data-a="vc">Voice</button><button data-a="vd">Video</button></div>
 <div id="msgs"></div>
 <div id="bar"><button data-a="pic">Photo</button><input id="mi" placeholder="Message" autocomplete="off"><button class="pri" data-a="send">Send</button><input id="file" type="file" accept="image/*" hidden></div>
</div>

<div id="call" class="screen"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div id="cname"></div>
 <div id="ctl"><button data-a="mute">Mute</button><button data-a="cam">Cam</button><button class="end" data-a="end">End</button></div></div>
<div id="inc" class="screen"><div class="brand" id="iname"></div><p class="tag" id="ityp"></p><div class="row" style="max-width:280px"><button class="ghost" data-a="dec">Decline</button><button class="pri" data-a="acc">Accept</button></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
 apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
 projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"});
const auth=firebase.auth(),db=firebase.firestore(),rdb=firebase.database(),$=s=>document.querySelector(s);
let me,prof,chatId,other,cap='',status={},chatsData={},watched={},unM,unRoom,pc,ls,cref,incoming,q=[],tick;
const TS=firebase.firestore.FieldValue.serverTimestamp;

/* ---------- auth UI ---------- */
const pw=(id,ph)=>`<div class="pw"><input id="${id}" type="password" placeholder="${ph}"><button type="button" class="eye" data-t="${id}">Show</button></div>`;
const capH=`<div class="cap"><span class="capv"></span><button type="button" data-a="rc">New code</button><input id="cin" placeholder="Type code" autocomplete="off"></div>`;
const V={
 login:`<div class="brand" style="font-size:34px">Linkora</div><p class="tag">Connect instantly. Talk freely.</p><input id="u" placeholder="Username" autocapitalize="none">${pw('p','Password')}<div class="err"></div><button class="pri" data-a="login">Sign in</button><div class="sep">or</div><button data-a="google">Continue with Google</button><button class="ghost" data-v="guest">Guest account</button>`,
 guest:`<h2>Guest account</h2><button class="pri" data-v="create">Create account</button><button data-v="glogin">Login account</button><button class="link" data-v="login">Back</button>`,
 create:`<h2>Create account</h2><input id="n" placeholder="Name"><input id="u" placeholder="Username (a-z, 0-9, _)" autocapitalize="none">${pw('p','Password (6+ characters)')}${pw('p2','Confirm password')}${capH}<div class="err"></div><button class="pri" data-a="create">Create account</button><button class="link" data-v="guest">Back</button>`,
 glogin:`<h2>Login account</h2><input id="u" placeholder="Username" autocapitalize="none">${pw('p','Password')}${capH}<div class="err"></div><button class="pri" data-a="login">Login</button><p class="sub">Guest accounts cannot reset a forgotten password.</p><button class="link" data-v="guest">Back</button>`};
function view(v){$('#ac').innerHTML=V[v];newCap()}
function newCap(){cap=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');document.querySelectorAll('.capv').forEach(e=>e.textContent=cap)}
const err=m=>{const e=$('#ac .err');if(e)e.textContent=m},mail=u=>u.trim().toLowerCase()+'@linkora.app';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
const val=id=>($('#'+id)||{}).value||'';

async function login(){
 const u=val('u'),p=val('p');if(!u||!p)return err('Enter username and password.');
 if($('#cin')&&val('cin').toUpperCase()!==cap){newCap();return err('Captcha does not match.')}
 try{await auth.signInWithEmailAndPassword(mail(u),p)}catch(e){err('Wrong username or password.')}}
async function create(){
 const n=val('n').trim(),u=val('u').trim().toLowerCase(),p=val('p');
 if(!n)return err('Enter your name.');if(!/^[a-z0-9_]{3,20}$/.test(u))return err('Username: 3-20 letters, numbers or _');
 if(p.length<6)return err('Password needs 6+ characters.');if(p!==val('p2'))return err('Passwords do not match.');
 if(val('cin').toUpperCase()!==cap){newCap();return err('Captcha does not match.')}
 try{const c=await auth.createUserWithEmailAndPassword(mail(u),p);await db.collection('users').doc(c.user.uid).set({name:n,username:u})}
 catch(e){err(e.code==='auth/email-already-in-use'?'Username is taken.':'Could not create account.')}}
const google=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(()=>err('Google sign-in failed.'));

auth.onAuthStateChanged(async u=>{
 if(!u){me=null;stopAll();show('auth');view('login');return}
 me=u;const r=db.collection('users').doc(u.uid);let d=await r.get();
 if(!d.exists){await r.set({name:u.displayName||'User',username:(u.email||'').split('@')[0]});d=await r.get()}
 prof=d.data();$('#mename').textContent=prof.name;$('#pn').textContent=prof.name;$('#pu').textContent='@'+prof.username;$('#pav').textContent=prof.name[0].toUpperCase();
 show('app');presence();listenChats();tick=setInterval(renderStatus,30000)});
function stopAll(){clearInterval(tick);Object.values(watched).forEach(f=>f());watched={};status={};if(unM)unM();if(unRoom)unRoom()}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

/* ---------- presence ---------- */
function presence(){
 const ref=rdb.ref('status/'+me.uid);
 rdb.ref('.info/connected').on('value',s=>{const on=s.val()===true;$('#medot').classList.toggle('on',on);
  if(on)ref.onDisconnect().set({online:false,last:firebase.database.ServerValue.TIMESTAMP}).then(()=>ref.set({online:true,last:firebase.database.ServerValue.TIMESTAMP}))})}
function ago(t){if(!t)return 'Offline';const s=(Date.now()-t)/1000;
 return 'Last seen '+(s<60?'just now':s<3600?(s/60|0)+' min ago':s<86400?(s/3600|0)+' h ago':(s/86400|0)+' d ago')}
const stTxt=u=>status[u]&&status[u].online?'Online':ago((status[u]||{}).last);

/* ---------- chats ---------- */
function listenChats(){
 db.collection('chats').where('members','array-contains',me.uid).onSnapshot(s=>{
  chatsData={};s.forEach(d=>{const c=d.data(),o=c.members.find(x=>x!==me.uid);chatsData[d.id]={id:d.id,o,name:c.names[o]};
   if(!watched[o])watched[o]=(f=>(rdb.ref('status/'+o).on('value',x=>{status[o]=x.val()||{};renderStatus()}),()=>rdb.ref('status/'+o).off()))();
   if(!watched['c'+d.id])watched['c'+d.id]=db.collection('chats').doc(d.id).collection('calls').doc('cur').onSnapshot(x=>onCall(d.id,x))});
  renderChats()})}
function renderChats(){const l=Object.values(chatsData);
 $('#chats').innerHTML=l.length?l.map(c=>`<div class="item" data-chat="${c.id}"><div class="av">${c.name[0].toUpperCase()}</div><div><b>${c.name}</b><small data-st="${c.o}">${stTxt(c.o)}</small></div></div>`).join(''):'<p class="empty">No chats yet. Create or join a room to connect.</p>'}
function renderStatus(){document.querySelectorAll('[data-st]').forEach(e=>e.textContent=stTxt(e.dataset.st));
 if(other){$('#odot').classList.toggle('on',!!(status[other]&&status[other].online));$('#ostat').textContent=stTxt(other)}}
function openChat(id){const c=chatsData[id];if(!c)return;chatId=id;other=c.o;$('#oname').textContent=c.name;show('chat');renderStatus();
 if(unM)unM();unM=db.collection('chats').doc(id).collection('msgs').orderBy('t').limit(150).onSnapshot(s=>{
  $('#msgs').innerHTML=s.docs.map(d=>{const m=d.data(),t=m.t?m.t.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
   return `<div class="m ${m.from===me.uid?'me':''}">${m.img?`<img src="${m.img}">`:''}${m.text?esc(m.text):''}<i>${t}</i></div>`}).join('');
  const b=$('#msgs');b.scrollTop=b.scrollHeight})}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mref=()=>db.collection('chats').doc(chatId).collection('msgs');
function send(){const t=val('mi').trim();if(!t)return;$('#mi').value='';mref().add({from:me.uid,text:t,t:TS()})}
function sendPic(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');
 c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);mref().add({from:me.uid,img:c.toDataURL('image/jpeg',.7),t:TS()})};i.src=r.result};r.readAsDataURL(f)}

/* ---------- rooms ---------- */
function mkRoom(){const code=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
 db.collection('rooms').doc(code).set({owner:me.uid,name:prof.name});
 $('#rbox').innerHTML=`<div class="code">${code}</div><p class="tag">Share this code. Waiting for someone to join...</p>`;
 if(unRoom)unRoom();unRoom=db.collection('rooms').doc(code).onSnapshot(d=>{const r=d.data();if(r&&r.joinedBy){unRoom();unRoom=null;db.collection('rooms').doc(code).delete();
  const id=[me.uid,r.joinedBy].sort().join('_');setTimeout(()=>{$('#rbox').innerHTML='';openChat(id)},800)}})}
function joinBox(){$('#rbox').innerHTML=`<input id="rc" placeholder="Room code" maxlength="6" autocapitalize="characters" style="text-align:center;letter-spacing:6px"><div class="err" id="re"></div><button class="pri" data-a="conn">Connect</button>`}
async function connect(){const code=val('rc').trim().toUpperCase(),d=await db.collection('rooms').doc(code).get();
 if(!d.exists||d.data().owner===me.uid){$('#re').textContent='Room not found. Check the code.';return}
 const r=d.data(),id=[me.uid,r.owner].sort().join('_');
 await db.collection('chats').doc(id).set({members:[me.uid,r.owner],names:{[me.uid]:prof.name,[r.owner]:r.name}},{merge:true});
 await db.collection('rooms').doc(code).update({joinedBy:me.uid});$('#rbox').innerHTML='';setTimeout(()=>openChat(id),600)}

/* ---------- calls (WebRTC, signaling in Firestore) ---------- */
const cdoc=id=>db.collection('chats').doc(id||chatId).collection('calls').doc('cur');
async function media(v){try{ls=await navigator.mediaDevices.getUserMedia({audio:true,video:v});$('#lv').srcObject=ls;$('#lv').style.display=v?'block':'none';return 1}catch(e){toast('Allow camera/mic to call.')}}
function mk(ref,cid){q=[];pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 ls.getTracks().forEach(t=>pc.addTrack(t,ls));pc.ontrack=e=>$('#rv').srcObject=e.streams[0];
 pc.onicecandidate=e=>e.candidate&&ref.collection('cand').add({cid,from:me.uid,c:e.candidate.toJSON()});
 ref.collection('cand').onSnapshot(s=>s.docChanges().forEach(ch=>{const d=ch.doc.data();if(ch.type==='added'&&d.cid===cid&&d.from!==me.uid){
  pc.remoteDescription?pc.addIceCandidate(d.c).catch(()=>{}):q.push(d.c)}}))}
async function call(v){if(!await media(v))return;const cid=Date.now();cref=cdoc();mk(cref,cid);
 const o=await pc.createOffer();await pc.setLocalDescription(o);
 await cref.set({cid,video:v,from:me.uid,state:'ringing',offer:{type:o.type,sdp:o.sdp},answer:null});
 $('#cname').textContent=chatsData[chatId].name;show('call')}
function onCall(id,s){const d=s.data();if(!d)return;
 if(d.from!==me.uid&&d.state==='ringing'&&!incoming&&!pc){incoming={id,d};$('#iname').textContent=chatsData[id].name;$('#ityp').textContent=d.video?'Video call':'Voice call';show('inc')}
 if(d.from===me.uid&&d.answer&&pc&&!pc.remoteDescription)pc.setRemoteDescription(d.answer).then(()=>{q.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));q=[]});
 if(d.state==='ended'){if(incoming&&incoming.id===id){incoming=null;if(!pc)show(chatId?'chat':'app')}if(pc)hang(false)}}
async function accept(){const{id,d}=incoming;incoming=null;if(!await media(d.video)){cdoc(id).update({state:'ended'});show('app');return}
 chatId=id;other=chatsData[id].o;cref=cdoc(id);mk(cref,d.cid);await pc.setRemoteDescription(d.offer);
 q.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));q=[];const a=await pc.createAnswer();await pc.setLocalDescription(a);
 await cref.update({answer:{type:a.type,sdp:a.sdp},state:'active'});$('#cname').textContent=chatsData[id].name;openChat(id);show('call')}
function hang(notify=true){if(notify&&cref)cref.update({state:'ended'});if(ls)ls.getTracks().forEach(t=>t.stop());if(pc)pc.close();pc=ls=null;
 $('#rv').srcObject=$('#lv').srcObject=null;show(chatId?'chat':'app')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,.item');if(!t)return;
 const D=t.dataset;
 if(D.v)return view(D.v);
 if(D.t){const i=$('#'+D.t),h=i.type==='password';i.type=h?'text':'password';t.textContent=h?'Hide':'Show';return}
 if(D.p){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===D.p));do
